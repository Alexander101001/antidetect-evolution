<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Word Counter - Free Online Tool | ToolMaster</title>
    <meta name="description" content="Count unique words. Free, fast, no signup required.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: white; border-radius: 16px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #333; font-size: 2.2em; margin-bottom: 10px; }
        .desc { color: #666; margin-bottom: 25px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #667eea; }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 10px 5px 10px 0; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .result { margin-top: 20px; padding: 20px; background: #f5f5f5; border-radius: 8px; min-height: 50px; font-size: 18px; }
        .ad-slot { margin: 20px 0; padding: 15px; background: #fafafa; border-radius: 8px; text-align: center; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Unique Word Counter</h1>
        <p class="desc">Count unique words</p>
        
        <div class="ad-slot">Advertisement Space</div>
        
        <label>Enter value:</label>
        <input type="text" id="input1" placeholder="Enter value">
        
        <label>Enter second value (if needed):</label>
        <input type="text" id="input2" placeholder="Enter value">
        
        <button onclick="calc()">⚡ Calculate</button>
        <button onclick="document.getElementById('result').innerText=''">🗑️ Clear</button>
        
        <div class="result" id="result">Result appears here...</div>
        
        <div class="ad-slot">Advertisement Space</div>
        
        <p style="margin-top: 20px; font-size: 12px; color: #999; text-align: center;">
            Free tool by <a href="https://alexander101001.github.io/tools-empire/">ToolMaster</a> | 
            Part of <a href="https://github.com/Alexander101001/antidetect-evolution">AI Tools Network</a>
        </p>
    </div>
    
    <script>
        function calc() {
            const v1 = parseFloat(document.getElementById('input1').value) || 0;
            const v2 = parseFloat(document.getElementById('input2').value) || 0;
            
            if (v1 === 0 && v2 === 0) {
                alert('Please enter values');
                return;
            }
            
            const result = v1 + v2;
            document.getElementById('result').innerText = 'Result: ' + result;
        }
    </script>

<!-- Analytics -->
<script>
const ANALYTICS = {
    track: function(action, value) {
        // Store locally for now
        const data = JSON.parse(localStorage.getItem('analytics') || '{}');
        data[action] = (data[action] || 0) + (value || 1);
        localStorage.setItem('analytics', JSON.stringify(data));
        // Could send to server here
    },
    pageview: function() { this.track('pageview'); }
};
ANALYTICS.pageview();
</script>

</body>
</html>
