name: 🧠 Continuous Learning

on:
  schedule:
    # Every 2 hours (well within free tier)
    - cron: '17 */2 * * *'  # At 00:17, 02:17, 04:17, etc
  workflow_dispatch:

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      
      - name: Micro Learn + Apply
        run: |
          cd research
          python3 micro_research.py
          python3 apply_smarter.py
      
      - name: Commit
        run: |
          git config user.email "bot@antidetect.local"
          git config user.name "Auto-Learner"
          git add -A
          git commit -m "🧠 Cycle $(date +%H:%M)" || echo "No changes"
          git push origin main || true
