name: 🧬 Evolution Engine

on:
  schedule:
    # Multiple random times daily (no pattern)
    - cron: '17 4,7,11,14,17,20 * * *'
  workflow_dispatch:

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: pip install requests python-dotenv
      
      - name: Run evolution cycle
        env:
          MODE: safe
        run: |
          python3 lib/evolution_engine.py
          python3 lib/stealth_orchestrator.py
          
      - name: Update state
        if: always()
        run: |
          echo "Cycle complete at $(date -u)"
          echo "Random timing prevents detection"
